name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        id: build
        run: echo "zip=$(sh build.sh | head -1)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release
        uses: KernelSU-Modules/tools/actions/module-release@b6d340ddcd562ad482568b6e66b8d7a9c34d645e
        with:
          zip: ${{ steps.build.outputs.zip }}
          generate-release-notes: true
